name: Deploy GitHub Pages

on:
  # Manual-only: the live site deploys from the `gh-pages` branch (built-in
  # "pages build and deployment"), so an automatic Actions deployment fails
  # with "deployment not allowed" and shows a permanent red X on every push
  # (release audit 53-WC-08). Switch the repo's Pages source to "GitHub
  # Actions" first, then run this workflow from the Actions tab to adopt it.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Auto-enable Pages with the "GitHub Actions" source. Without this,
          # deploy-pages fails with "deployment not allowed" when the repo's
          # Pages source was never switched to Actions (release audit 53-WC-08).
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
