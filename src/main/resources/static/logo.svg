<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- Canonical JunifyDB Volt logo: dark bolt on Volt amber rounded square.
       Single source of truth with the website mascot mark (docs/index.html),
       audit 52-BR-03. Previously an off-brand indigo/violet gradient. -->
  <defs>
    <linearGradient id="voltAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect x="20" y="20" width="360" height="360" rx="80" fill="url(#voltAmber)"/>
  <g transform="translate(200,200) scale(2.6)">
    <path d="M18 -36 L-24 28 L-2 28 L-12 64 L26 8 L2 8 Z" fill="#0f1117"/>
  </g>
</svg>
